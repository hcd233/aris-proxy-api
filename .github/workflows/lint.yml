name: Lint

# lint 独立于构建部署：PR 到 master 只触发本 workflow（不构建镜像）；
# push master 时与构建部署并行执行，不阻塞上线（直推代码的 lint 兜底）。
# 不设 paths 过滤：本 workflow 的两个 job 是 branch protection 的 required check，
# paths 过滤会导致 check 不上报、PR 无法合并。
on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # workflow 语法/表达式静态校验（2026-08-22 CI 拆分曾因 IMAGE_TAG 残留、
      # COPY --from 变量展开等问题连环修复 8 次——CI 变更本身没有 CI 验证）。
      # PR 不触发 docker-publish，workflow 错误只能在此处提前拦截。
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      # go:embed all:dist 要求目录存在且非空，lint 无需真实前端产物
      - name: Placeholder web dist for embed
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: ESLint
        run: npm run lint
        working-directory: web

      - name: Prettier format check
        run: npm run format:check
        working-directory: web
