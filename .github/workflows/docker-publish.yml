name: Docker-Publish

# 构建 + 部署流水线（lint 见 lint.yml，PR 不触发本 workflow）。
# 生产为单节点 amd64 k3s，只构建 linux/amd64。
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '26 21 * * *'
  push:
    branches: [ "master" ]
    tags: [ 'v*.*.*' ]
    paths:
      - 'internal/**'
      - 'docker/**'
      - 'cmd/**'
      - 'web/**'
      - 'k8s/**'
      - 'script/**'
      - '.github/workflows/docker-publish.yml'
      - 'go.mod'
      - 'go.sum'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 步骤一：构建。Go 在 runner 上增量编译（GOCACHE 缓存），镜像内只打包二进制，
  # 避免容器内全量重编 + upx 压缩（原单步 ~100s）。
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute web hash
        id: web-hash
        run: echo "key=frontend-${{ hashFiles('web/**') }}" >> "$GITHUB_OUTPUT"

      - name: Cache frontend build
        id: web-cache
        uses: actions/cache@v4
        with:
          path: web/out
          key: ${{ steps.web-hash.outputs.key }}

      - name: Build frontend (on cache miss)
        if: steps.web-cache.outputs.cache-hit != 'true'
        run: cd web && npm ci && npm run build

      # 与 Makefile web-build 保持一致：embed 前对所有静态文件 gzip 预压缩
      # （服务端按 Accept-Encoding 直发压缩内容；未压缩产物也能由 readStatic 回退兜底）
      - name: Gzip frontend assets for embed
        run: find web/out -type f -exec gzip -9 {} +

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.run_id }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.mod') }}-
            go-build-${{ runner.os }}-

      - name: Build server binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o aris-proxy-api ./cmd/server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            FRONTEND_SOURCE=frontend-prebuilt
            BINARY_SOURCE=binary-prebuilt
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 步骤二：发布。推送生产 k3s 并滚动更新（仅 master push）。
  publish:
    runs-on: ubuntu-latest
    needs:
      - build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to k3s via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd ${{ secrets.PRODUCTION_REPO_PATH }}
            git fetch --prune origin
            git reset --hard origin/master
            bash script/deploy-k8s.sh
            for i in $(seq 1 60); do
              if curl -kfsS --max-time 5 https://api.lvlvko.top/health; then
                exit 0
              fi
              echo "waiting for production domain health (${i}/60)" >&2
              sleep 1
            done
            exit 1
