name: Release Client

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # docs/diagrams 下的架构图走 Git LFS：关掉 smudge 会拿到指针文件
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'

      - name: Build client binaries
        run: VERSION=${GITHUB_REF_NAME} make build-client-all

      - name: Package binaries as tar.gz and generate checksums
        run: |
          staging=$(mktemp -d)
          dist=build/client
          for binary in "$dist"/aris-*; do
            name=${binary##*/}
            cp "$binary" "$staging/aris"
            tar -czf "$binary.tar.gz" -C "$staging" aris
            # 在产物目录内计算摘要：sha256sum 会把参数原样写进文件，带 build/client/ 前缀时
            # 已发布的老版本客户端（严格比对文件名）会判定 "Invalid checksum file"。
            (cd "$dist" && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
            rm "$binary"
          done
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/client/aris-*.tar.gz
            build/client/aris-*.tar.gz.sha256
